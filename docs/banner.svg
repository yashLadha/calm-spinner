<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b56cf5"/>
      <stop offset="0.5" stop-color="#f06bb0"/>
      <stop offset="1" stop-color="#f5a35c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f06bb0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f06bb0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0d0d12"/>
  <circle cx="640" cy="250" r="260" fill="url(#glow)"/>
  <g transform="translate(640 250)" fill="none" stroke-linecap="round">
    <circle r="92" stroke="#26262f" stroke-width="18"/>
    <circle r="92" stroke="url(#wave)" stroke-width="18" stroke-dasharray="390 188" transform="rotate(-90)"/>
    <circle r="56" stroke="url(#wave)" stroke-width="10" stroke-opacity="0.55" stroke-dasharray="120 232" transform="rotate(60)"/>
  </g>
  <text x="640" y="450" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="84" font-weight="700" fill="url(#wave)">calm-spinner</text>
  <text x="640" y="515" text-anchor="middle" font-family="JetBrains Mono, SF Mono, Menlo, Consolas, monospace" font-size="30" fill="#8a8a99">a calmer, prettier spinner line for Claude Code</text>
</svg>
